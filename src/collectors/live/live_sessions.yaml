# Lịch thu thập live của TV3 (Ly) — mọi giờ theo múi giờ dưới đây (đổi được).
# Mỗi phiên = một đoạn dữ liệu riêng (session_id), KHÔNG ghép hai phiên thành chuỗi liền.
timezone: Asia/Ho_Chi_Minh
start_date: 2026-10-17
end_date: 2026-10-23          # dừng thu thập hết ngày này (để dành 24–26/10 cho backtest B, hồi quy, báo cáo)
interval_s: 5                 # chu kỳ lấy mẫu (C3.02)
flush_every_s: 60             # ghi part Parquet mỗi 60 giây (mất tối đa 60s nếu máy sập)
symbol: BTC/USDT
book_limit: 200               # C3.03: tính depth +/-10bps; luôn ghi depth_censored nếu chưa phủ đủ
# Mỗi dòng = một thị trường cần thu: spot VÀ perpetual (cột market_type = spot | perp).
# ccxt_id: id CCXT dùng để kết nối; exchange: tên sàn ghi vào dữ liệu (chữ thường theo quy ước nhóm).
# Perp dùng ký hiệu CCXT dạng BTC/USDT:USDT. Kraken/Coinbase chỉ có spot USDT trong cấu hình này
# (Kraken perp là krakenfutures, quote USD; thêm sau nếu nhóm cần).
venues:
  - {exchange: binance,  market_type: spot, ccxt_id: binance,     symbol: "BTC/USDT", book_limit: 1000}
  - {exchange: binance,  market_type: perp, ccxt_id: binanceusdm, symbol: "BTC/USDT:USDT", book_limit: 1000}
  - {exchange: okx,      market_type: spot, ccxt_id: okx,         symbol: "BTC/USDT", book_limit: 400}
  - {exchange: okx,      market_type: perp, ccxt_id: okx,         symbol: "BTC/USDT:USDT", book_limit: 400}
  - {exchange: bybit,    market_type: spot, ccxt_id: bybit,       symbol: "BTC/USDT"}
  - {exchange: bybit,    market_type: perp, ccxt_id: bybit,       symbol: "BTC/USDT:USDT"}
  - {exchange: kraken,   market_type: spot, ccxt_id: kraken,      symbol: "BTC/USDT"}
  - {exchange: coinbase, market_type: spot, ccxt_id: coinbaseexchange, symbol: "BTC/USDT"}

# Khung giờ phiên (giờ VN): S1 14:00–17:00 (châu Âu mở), S2 20:00–23:00 (Mỹ mở).
sessions_weekend:             # Thứ Bảy, Chủ Nhật
  - {name: S1, start: "14:00", end: "17:00"}   # sàn châu Âu mở
  - {name: S2, start: "20:00", end: "23:00"}   # sàn Mỹ mở
sessions_weekday:             # Thứ Hai → Thứ Sáu
  - {name: S1, start: "14:00", end: "17:00"}   # sàn châu Âu mở
  - {name: S2, start: "20:00", end: "23:00"}   # sàn Mỹ mở
