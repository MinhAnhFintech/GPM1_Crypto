# Project configuration (C1.02, TV1). Based on the TV4 template config.example.yaml.
# All timestamps are UTC with a trailing Z. Read by run_all.py and the collectors; never hard-code these values elsewhere.
contract_version: '1.0'
symbol: BTC/USDT
timeframe: 1min            # sync grid step (1 minute)
max_age: 5min              # align_previous_tick: a quote older than this becomes missing (NaN), never interpolated
seed: 20261017             # the only random seed used by the project
rolling:
  window_obs: 1440         # rolling window length in observations (1440 x 1min = 1 day)
  step_obs: 60             # window step in observations (60 x 1min = 1 hour)
split_ratios: [0.6, 0.2, 0.2]   # chronological development / validation / final test; final test is used once
max_lag: 5                 # maximum lag (minutes) of the lead-lag cross-correlation

# Historical sample, compared against ts_available. start inclusive, end EXCLUSIVE.
# ts_available of a 1-minute candle = candle open time + 1 minute, so start = first candle open 2025-10-18 00:00 + 1 min.
# end: the Binance Vision collector downloads closed MONTHS only (it stops with an error for the current month),
# so the sample ends at the month boundary. Last candle kept opens 2026-09-30 23:58 (ts_available 2026-09-30 23:59).
# Confirmed by the team lead on 2026-10-24 (all of D1/D3/D4/D5 are built on it); live quotes (from 2026-10-17) are a separate data_kind.
sample:
  start: '2025-10-18T00:01:00Z'
  end: '2026-10-01T00:00:00Z'

# Venue = {exchange}_{market_type}. Ids only (run_all --mode raw matches them against {venue}_BTCUSDT_1m.parquet file names).
# Connection details (ccxt_id, symbol) live in config/exchanges.yaml. Keep both lists identical and in sync with fees.yaml.
venues:
  - binance_spot
  - binance_perp
  - okx_spot
  - okx_perp
  - bybit_spot
  - bybit_perp

# TV6 (C6.03): gap event detection (src/cost_model/gap_events.py). Other keys belong to TV1.
gap_events:
  gap_threshold_bps: 2.0  # gross_gap_bps >= threshold counts as a gap (~p99 of live and historical gaps; 22.8k events on dev, 167 at 5 bps). Chot boi nhom truong 23/10; C6.07/sensitivity thu 1, 2, 3, 5
  grid_step_s: 60         # historical panel: spacing of consecutive observations (1min grid)
  live_grid_step_s: 5     # live D2: collector cadence (5 s grid)
  live_max_age_s: 6       # live D2: a quote older than this is missing (NaN); never carried forward

# TV2 (C2.02): OHLCV quality flags (src/features/ohlcv_quality.py). Other keys belong to TV1.
quality:
  jump_bps: 300.0   # |log return close-close 1 phut| > nguong -> chi danh dau de xem lai, khong sua du lieu. TODO: nhom chot

# TV6 (C6.04): backtest A, close proxy (src/backtest/engine.py). Other keys belong to TV1.
backtest_a:
  latency_min: 1              # fill L minutes after the decision (latency is time, not a fee). Chot 23/10: smallest realistic lag on a 1-min grid; C6.07 varies 1, 2, 5
  entry_threshold_bps: 0.0    # signal when expected net_gap_bps at decision > threshold. Chot 23/10: not tuned on data; kept at 0 in C6.07
  qty_btc: 0.1                # BTC per signal (~8.2k USDT; 0.04-0.7% of the p5 +-10bps depth, so no size slippage modelled); capital pre-positioned on every venue. Chot 23/10; C6.07 keeps 0.1 for A (the proxy has no depth, size only scales P&L) and varies slippage 0/1/2 bps instead
  fee_type: taker
  half_spread_statistic: median   # assumed half spread per venue = median(live D2 spread_bps) / 2

# TV6 (C6.05): backtest B, live bid/ask (src/backtest/engine_live.py). Grid/age come from gap_events.live_*.
backtest_b:
  latency_s: 5                # fill L seconds after the decision = one live grid step (smallest L > 0 on the 5 s grid); C6.07 varies 5, 10, 30
  entry_threshold_bps: 0.0    # same rule as backtest A: signal when decision net_gap_bps > threshold
  qty_btc: 0.1                # same size as backtest A; C6.07 varies 0.01, 0.1, 1 (the touch size is observed live)
  fee_type: taker
  require_top_size: true      # reject when the touch size on either leg is below qty_btc (deeper levels are not observed)

# Team modules registered here run after the TV4 foundation. Paths are relative
# to repo; each command is an argv list (no shell), with {data_dir}/{output_dir}.
# C4.12 (TV4): the team CLIs as handed off, in dependency order. A failure stops the run.
# D3/D4 and every derived file use {data_dir}; tables/figures use {output_dir}. Handoff inputs that
# the pipeline does not rebuild stay at their contract paths: D1 data/interim, live D2 and D9 in
# data/processed. stress_regime only takes a project root, so {data_dir} must be
# {output_dir}/../data/processed (true for the defaults data/processed and outputs).
# Not rerun: T5b (C6.07) used the final test once (split_manifest.json test_consumed=true);
# T2_vecm_spec.json is locked on dev and reused, so it is not a rewritten output.
pipeline_stages:
  - name: features                      # TV2 C2.04: D3 -> D3b
    command: ['{python}', '-m', scripts.build_features_1m, --panel, '{data_dir}/panel_1m_wide.parquet',
              --out, '{data_dir}/features_1m.parquet']
    timeout_s: 1800
    outputs: ['{data_dir}/features_1m.parquet']
  - name: regime_flags                  # TV1 C1.06: D3 + D3b + D4 -> D5 (high-vol threshold fit on dev)
    command: ['{python}', '-m', src.features.regime_flags, --panel, '{data_dir}/panel_1m_wide.parquet',
              --features, '{data_dir}/features_1m.parquet', --manifest, '{data_dir}/split_manifest.json',
              --events, config/events.yaml, --output, '{data_dir}/regime_flags.parquet',
              --receipt, '{data_dir}/regime_flags_receipt.json']
    timeout_s: 1800
    outputs: ['{data_dir}/regime_flags.parquet', '{data_dir}/regime_flags_receipt.json']
  - name: price_discovery               # TV5 C5.05-C5.09: T2/T3/T3b/T3c/T3d and D6 (dev + val only)
    command: ['{python}', '-m', src.price_discovery.run_price_discovery, --data-dir, '{data_dir}',
              --output-dir, '{output_dir}', --config, config/config.yaml, --workers, '6']
    timeout_s: 14400
    outputs:
      - '{output_dir}/tables/T2_stationarity_dev.csv'
      - '{output_dir}/tables/T2_stationarity_val.csv'
      - '{output_dir}/tables/T2_johansen_dev.csv'
      - '{output_dir}/tables/T2_johansen_val.csv'
      - '{output_dir}/tables/T3_static_is_cs.csv'
      - '{output_dir}/tables/T3_vecm_diagnostics.csv'
      - '{output_dir}/tables/T3d_ils.csv'
      - '{output_dir}/tables/T3d_ils_summary.csv'
      - '{output_dir}/tables/T3c_spot_perp.csv'
      - '{output_dir}/tables/rolling_is.parquet'
      - '{output_dir}/tables/T3b_sensitivity.csv'
  - name: price_discovery_live          # TV3 C3.07 input: IS per live session with the locked spec
    command: ['{python}', '-m', src.price_discovery.run_live_is, --quotes, data/processed/live_quotes_long.parquet,
              --spec, '{output_dir}/tables/T2_vecm_spec.json', --out, '{data_dir}/live_session_is.parquet']
    timeout_s: 3600
    outputs: ['{data_dir}/live_session_is.parquet']
  - name: cost_gap_events_live          # TV6 C6.03: D7 from live bid/ask (contract path)
    command: ['{python}', '-m', src.cost_model.run_gap_events, --quotes, data/processed/live_quotes_long.parquet,
              --config, config/config.yaml, --fees, config/fees.yaml, --output, '{output_dir}/tables/gap_events.parquet']
    timeout_s: 1800
    outputs: ['{output_dir}/tables/gap_events.parquet']
  - name: cost_gap_events_historical    # TV6 C6.03: close-proxy events on dev, half spread from live D2
    command: ['{python}', '-m', src.cost_model.run_gap_events, --panel, '{data_dir}/panel_1m_wide.parquet',
              --manifest, '{data_dir}/split_manifest.json', --split, dev,
              --calibration-quotes, data/processed/live_quotes_long.parquet, --config, config/config.yaml,
              --fees, config/fees.yaml, --output, '{output_dir}/tables/gap_events_historical.parquet']
    timeout_s: 1800
    outputs: ['{output_dir}/tables/gap_events_historical.parquet']
  - name: cost_backtest_a               # TV6 C6.04: proxy backtest on dev at backtest_a.latency_min
    command: ['{python}', '-m', src.backtest.run_backtest_a, --panel, '{data_dir}/panel_1m_wide.parquet',
              --manifest, '{data_dir}/split_manifest.json', --live-quotes, data/processed/live_quotes_long.parquet,
              --split, dev, --config, config/config.yaml, --fees, config/fees.yaml, --output-dir, '{output_dir}/tables']
    timeout_s: 3600
    outputs:
      - '{output_dir}/tables/backtest_a_dev_L1_ledger.parquet'
      - '{output_dir}/tables/backtest_a_dev_L1_summary.csv'
      - '{output_dir}/tables/backtest_a_dev_L1_params.json'
      - '{output_dir}/tables/half_spread_calibration.csv'
  - name: cost_backtest_b               # TV6 C6.05: live bid/ask backtest -> D8 trades_ledger
    command: ['{python}', '-m', src.backtest.run_backtest_b, --quotes, data/processed/live_quotes_long.parquet,
              --config, config/config.yaml, --fees, config/fees.yaml, --output-dir, '{output_dir}/tables']
    timeout_s: 3600
    outputs:
      - '{output_dir}/tables/trades_ledger.parquet'
      - '{output_dir}/tables/backtest_b_L5s_summary.csv'
      - '{output_dir}/tables/backtest_b_L5s_by_market.csv'
      - '{output_dir}/tables/backtest_b_L5s_params.json'
  - name: cost_backtest                 # TV6 C6.06: T5 cost waterfall of backtests A and B
    command: ['{python}', '-m', src.backtest.make_t5, --a-ledger, '{output_dir}/tables/backtest_a_dev_L1_ledger.parquet',
              --b-ledger, '{output_dir}/tables/trades_ledger.parquet', --config, config/config.yaml,
              --output-dir, '{output_dir}/tables']
    timeout_s: 1800
    outputs: ['{output_dir}/tables/T5_arbitrage_net.csv', '{output_dir}/tables/T5_arbitrage_net_sources.json']
  - name: cost_reconcile                # TV6 C6.10: T5c ledger reconciliation
    command: ['{python}', '-m', src.backtest.reconcile, --a-ledger, '{output_dir}/tables/backtest_a_dev_L1_ledger.parquet',
              --b-ledger, '{output_dir}/tables/trades_ledger.parquet', --config, config/config.yaml,
              --fees, config/fees.yaml, --output-dir, '{output_dir}/tables']
    timeout_s: 1800
    outputs: ['{output_dir}/tables/T5c_ledger_reconciliation.csv', '{output_dir}/tables/T5c_ledger_balances.csv']
  - name: cost_regime                   # TV6 C6.09: T6b gap and net by regime (needs D5)
    command: ['{python}', '-m', src.backtest.make_t6b, --tables, '{output_dir}/tables',
              --regime, '{data_dir}/regime_flags.parquet', --manifest, '{data_dir}/split_manifest.json',
              --live-quotes, data/processed/live_quotes_long.parquet, --config, config/config.yaml,
              --output-dir, '{output_dir}/tables']
    timeout_s: 1800
    outputs: ['{output_dir}/tables/T6b_gap_by_regime.csv', '{output_dir}/tables/T6b_gap_by_regime_sources.json']
  - name: cost_figures                  # TV6 C6.08: F4 gap duration, F5 cumulative P&L
    command: ['{python}', '-m', src.backtest.make_figures, --tables, '{output_dir}/tables', --config, config/config.yaml,
              --output-dir, '{output_dir}/figures']
    timeout_s: 1800
    outputs: ['{output_dir}/figures/F4_gap_duration.png', '{output_dir}/figures/F5_cumulative_pnl.png']
  - name: evaluation_liquidity          # TV3 C3.07: T4 (models A on D6 + D3b, B on live session IS)
    command: ['{python}', '-m', notebooks.tv3.liquidity_regression, --rolling-is, '{output_dir}/tables/rolling_is.parquet',
              --features, '{data_dir}/features_1m.parquet', --live, data/processed/live_quotes_long.parquet,
              --live-is, '{data_dir}/live_session_is.parquet', --out, '{output_dir}/tables/T4_leadership_determinants.csv']
    timeout_s: 3600
    outputs: ['{output_dir}/tables/T4_leadership_determinants.csv']
  - name: evaluation                    # TV3 C3.08: T6 rolling IS by regime (D6 + D5)
    command: ['{python}', '-m', src.evaluation.stress_regime, --project-root, '{output_dir}/..']
    timeout_s: 1800
    outputs: ['{output_dir}/tables/T6_stress.csv']
  - name: exchange_characteristics      # TV1 C1.07: T1 per venue (volume on dev + val only)
    command: ['{python}', '-m', scripts.exchange_characteristics, --ohlcv, data/interim/ohlcv_1m_long.parquet,
              --live, data/processed/live_quotes_long.parquet, --funding, data/processed/funding_oi.parquet,
              --manifest, '{data_dir}/split_manifest.json', --fees, config/fees.yaml,
              --out, '{output_dir}/tables/T1_exchange_characteristics.csv', --sample, dev_val]
    timeout_s: 1800
    outputs: ['{output_dir}/tables/T1_exchange_characteristics.csv']
  - name: figures_f1_f2                 # TV2 C2.05: F1 prices, F2 dispersion
    command: ['{python}', '-m', notebooks.tv2.plot_c2_05, --panel, '{data_dir}/panel_1m_wide.parquet',
              --out-dir, '{output_dir}/figures']
    timeout_s: 1800
    outputs: ['{output_dir}/figures/F1_synchronized_prices.png', '{output_dir}/figures/F2_price_dispersion.png']
  - name: figures_f3                    # TV2 C2.06: F3 from D6, F6 from D3b dev, F7 from T3c
    command: ['{python}', '-m', scripts.make_figure_f3, --rolling, '{output_dir}/tables/rolling_is.parquet',
              --out, '{output_dir}/figures/F3_rolling_is_bounds.png']
    timeout_s: 1800
    outputs: ['{output_dir}/figures/F3_rolling_is_bounds.png']
  - name: figures_f6
    command: ['{python}', '-m', scripts.make_figure_f6, --features, '{data_dir}/features_1m.parquet',
              --panel, '{data_dir}/panel_1m_wide.parquet', --split-manifest, '{data_dir}/split_manifest.json',
              --config, config/config.yaml, --out, '{output_dir}/figures/F6_leadlag_xcorr.png']
    timeout_s: 1800
    outputs: ['{output_dir}/figures/F6_leadlag_xcorr.png']
  - name: figures_f7
    command: ['{python}', '-m', scripts.make_figure_f7, --t3c, '{output_dir}/tables/T3c_spot_perp.csv',
              --out, '{output_dir}/figures/F7_spot_perp_is_ils.png']
    timeout_s: 1800
    outputs: ['{output_dir}/figures/F7_spot_perp_is_ils.png']
