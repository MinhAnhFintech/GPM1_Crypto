# Cost-model defaults (TV6). Not an exchange; all values in bps one-way per leg.
defaults:
  slippage_bps: 0.0     # base scenario; sensitivity runs override it
  extra_cost_bps: 0.0   # capital pre-positioned on both venues (contract 2.5)
  # TODO: lay tu mau live D2 cua TV3 (median spread_bps / 2). null = chua co;
  # close-only mode will then raise instead of silently using 0.
  assumed_half_spread_bps: null
