# Trading fee configuration
# Task: C1.01 - Bieu phi cac san
#
# Unit: basis points (bps), one-way
# 1 bps = 0.01%
#
# Assumption:
# - Use standard / Regular User / VIP 0 taker fees.
# - No VIP discounts.
# - No token-based fee discounts (BNB, etc.).
# - Fees are one-way and will be applied separately to buy and sell legs.
#
# Checked on: 2026-10-17
#
# Read by src/cost_model/costs.py::load_fees (TV6). Layout: {exchange}: {market_type}: {...}
# -> venue {exchange}_{market_type}. taker_bps is required (default scenario);
# maker_bps is only for the side scenario. A venue missing here is an error, never fee 0.


binance:
  spot:
    taker_bps: 10.0
    maker_bps: null  # Chua xac minh; chan kich ban maker cho den khi TV1 bo sung nguon.
    source_url: "https://www.binance.com/en/fee/trading"
    checked_on: "2026-10-17"

  perp:
    taker_bps: 5.0
    maker_bps: null  # Chua xac minh; chan kich ban maker cho den khi TV1 bo sung nguon.
    source_url: "https://www.binance.com/en-BH/fee/futureFee"
    checked_on: "2026-10-17"


